<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Petal & Co. — Photo Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>

<header class="site-header">
  <span class="badge">🌸 Photo Diary</span>
  <h1>Petal <span>&amp;</span> Co.</h1>
  <p class="sub">A little gallery of soft, pretty things</p>
</header>

<nav class="filters" aria-label="Filter by category">
  <button class="filter-btn active" data-filter="all">✨ All</button>
  <button class="filter-btn" data-filter="pastel">🌷 Pastel</button>
  <button class="filter-btn" data-filter="bloom">🌼 Bloom</button>
  <button class="filter-btn" data-filter="dreamy">☁️ Dreamy</button>
</nav>

<main class="gallery" id="gallery">
  <!-- cards injected by JS -->
</main>

<div class="lightbox" id="lightbox" aria-hidden="true">
  <button class="lb-close" id="lbClose" aria-label="Close">&times;</button>
  <button class="lb-nav lb-prev" id="lbPrev" aria-label="Previous image">&#8249;</button>
  <figure class="lb-figure">
    <img id="lbImage" src="" alt="">
    <figcaption>
      <span id="lbTitle"></span>
      <span class="lb-index" id="lbIndex"></span>
    </figcaption>
  </figure>
  <button class="lb-nav lb-next" id="lbNext" aria-label="Next image">&#8250;</button>
</div>

<footer class="site-footer">made with 🩷 — Petal &amp; Co.</footer>

<script src="script.js"></script>
</body>
</html>
